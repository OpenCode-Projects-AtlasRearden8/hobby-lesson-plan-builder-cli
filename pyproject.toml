[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lesson-builder"
version = "1.0.0"
description = "Offline CLI that turns a bullet list into a friendly, paced lesson plan with printable one-page lesson cards."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["lesson-plan", "education", "beginner", "offline", "ollama", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

[project.scripts]
lesson-builder = "lesson_builder.cli:main"

[tool.setuptools.packages.find]
include = ["lesson_builder*"]
